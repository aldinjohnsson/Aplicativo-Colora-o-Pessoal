<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Ícone da aba do navegador (antes era o vite.svg padrão) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- PWA / "Adicionar à tela inicial" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#B76E79" />

    <!-- iOS: sem isso, "Adicionar à Tela de Início" usa um print da página
         como ícone em vez da logo, e abre como aba comum do Safari (com
         barra de endereço) em vez de tela cheia. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MS Color IA" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Portal do Cliente - Análise de Coloração Pessoal</title>

    <!-- DIAGNÓSTICO TEMPORÁRIO: mostra na tela qualquer erro que cause tela
         branca (JS ou falha ao carregar o script). Sintaxe ES5 de propósito,
         para rodar até em Safari muito antigo. Remova depois de achar a causa. -->
    <script>
      function showErr(msg) {
        var p = document.createElement('pre');
        p.style.cssText = 'padding:12px;white-space:pre-wrap;word-break:break-all;font-size:12px;color:#b00;background:#fff;position:relative;z-index:99999';
        p.textContent = msg;
        (document.body || document.documentElement).insertBefore(p, (document.body || document.documentElement).firstChild);
      }
      window.addEventListener('error', function (e) {
        var src = e.filename || (e.target && (e.target.src || e.target.href)) || '';
        showErr('ERRO: ' + (e.message || 'falha ao carregar recurso') + '\n' + src);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        showErr('PROMISE: ' + ((e.reason && e.reason.message) || e.reason));
      });
    </script>

    <!-- Google Fonts usadas pela Ferramenta de Análise da Íris -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Lora:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
